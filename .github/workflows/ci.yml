name: Verify platform and Docker deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOMAIN: palette.example.com
      ACME_EMAIL: ci@example.com
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Compose and Caddy
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Build application container
        run: docker build --tag palette-studio:ci .
      - name: Check fresh container with a persistent volume
        run: |
          docker run --detach --name palette-studio-ci --publish 127.0.0.1:8770:8770 --volume palette-ci-generated:/app/generated palette-studio:ci
          python scripts/verify_http.py http://127.0.0.1:8770 --wait 600
      - name: Container logs
        if: always()
        run: docker logs palette-studio-ci 2>&1 || true
