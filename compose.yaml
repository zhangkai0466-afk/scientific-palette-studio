services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    expose:
      - "8770"
    volumes:
      - generated_previews:/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8770/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  generated_previews:
  caddy_data:
  caddy_config:
